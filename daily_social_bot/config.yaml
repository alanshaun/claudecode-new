# ═══════════════════════════════════════════════════════════
#  Daily Social Automation — 配置文件
# ═══════════════════════════════════════════════════════════

schedule:
  hour: 9
  minute: 0
  timezone: "Asia/Shanghai"

# ── 信息源 ────────────────────────────────────────────────
sources:
  # HackerNews Top Stories（英文科技/AI/创业）
  twitter:
    accounts: []          # 保留字段，实际由 HackerNews 抓取
    max_per_account: 15   # 抓取 HN top N 条

  # RSS 订阅（中文科技/商业）
  rss:
    feeds:
      - url: "https://36kr.com/feed"
        name: "36氪"
      - url: "https://www.huxiu.com/rss/article.xml"
        name: "虎嗅"
      - url: "https://sspai.com/feed"
        name: "少数派"
      - url: "https://www.producthunt.com/feed"
        name: "Product Hunt"
    max_per_feed: 5

  # 保留字段兼容
  xiaohongshu:
    keywords: []
    max_per_keyword: 0

# ── 内容筛选 ──────────────────────────────────────────────
selector:
  model: "claude-opus-4-6"
  criteria: |
    你关注的领域：AI、创业、产品、商业、一人公司（solopreneur/indie hacker）

    优先选择：
    1. AI 技术突破或 AI 产品落地的新鲜案例
    2. 一个人或小团队做出有影响力产品的故事
    3. 有反常识洞见、具体数据或真实案例的内容
    4. 商业模式创新或产品增长的新思路

    避免：
    - 纯新闻资讯（没有观点的信息播报）
    - 广告/软文/融资公告（无干货）
    - 宏观政策/金融市场类内容

# ── 推文生成 ──────────────────────────────────────────────
generator:
  model: "claude-opus-4-6"
  tweet_count: 3
  style: |
    风格要求：
    - 多段落，发现/策展语气，像在跟朋友分享一个宝藏
    - 有具体产品名、数据（star数/ARR/用户量/价格）、人名
    - 口语化，有自己的判断，不是标题党
    - 不用 hashtag，不用 emoji，不用感叹号堆砌
    - 中文为主，专有名词保留英文
    - 结尾一句是个人判断或感悟，落地到"对独立开发者/创业者意味着什么"
    - 长度：6~12 行，不要压缩成一句话

    好推文示例（严格模仿这个风格和长度）：

    示例1：
    "刚看到一个 GitHub 仓库，专门给创始人讲增长的，4.7k star。
    里面列了几十种增长框架，从冷启动到规模化都有覆盖：
    - 如何找到你的第一批 100 个用户
    - B2B vs B2C 的获客路径差异
    - 内容营销 + SEO 的具体打法
    - 社区运营从 0 到 1 的节奏
    仓库名叫 marketing-for-engineers，作者是 @craftbyzen。
    独立开发者最容易犯的错，不是产品做得不好，而是以为做好产品用户自然会来。"

    示例2：
    "推荐一个飞书技能，@zarazhangrui 做的，专门用来做 AI 内容策展。
    她每天用这个工具扫一遍 RSS + Twitter，自动总结 + 打标签，
    最后输出一份「今日值得读」的清单发给自己。
    整个流程不超过 5 分钟，但信噪比比自己手刷高很多。
    工具本身不复杂，难的是把「每天做」这件事自动化掉。"

# ── 发布 ──────────────────────────────────────────────────
poster:
  confirm_timeout_minutes: 60
