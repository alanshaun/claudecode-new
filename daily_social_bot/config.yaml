# ═══════════════════════════════════════════════════════════
#  Daily Social Automation — 配置文件
# ═══════════════════════════════════════════════════════════

schedule:
  hour: 9       # 每天几点运行
  minute: 0
  timezone: "Asia/Shanghai"

# ── 信息源 ────────────────────────────────────────────────
sources:
  twitter:
    # 关注的账号 (不含 @)
    accounts:
      - elonmusk
      - sama
      - karpathy
    # 每个账号抓最近几条
    max_per_account: 10

  xiaohongshu:
    # 搜索关键词列表 (每次取前 N 条)
    keywords:
      - AI创业
      - 出海产品
    max_per_keyword: 5

# ── 内容筛选 ──────────────────────────────────────────────
selector:
  # Claude 模型
  model: "claude-opus-4-6"
  # 筛选标准（写进 prompt）
  criteria: |
    优先选择：
    1. 有独特洞见或数据支撑的内容
    2. 与 AI、创业、出海相关的内容
    3. 近 24 小时内互动量高的内容
    避免：转发/广告/纯情绪内容

# ── 推文生成 ──────────────────────────────────────────────
generator:
  model: "claude-opus-4-6"
  tweet_count: 3
  style: |
    风格要求：
    - 简洁有力，不超过 220 字符
    - 有一句话核心洞察
    - 口语化，不用 hashtag，不用 emoji
    - 中文或英文（根据原文语言决定）
    示例风格：
    "大模型正在把搜索引擎变成答案机器。问题不是 Google 会不会死，而是哪类信息查询会先消失。"

# ── 发布 ──────────────────────────────────────────────────
poster:
  # 确认超时后自动跳过（不发布），单位：分钟
  confirm_timeout_minutes: 60
