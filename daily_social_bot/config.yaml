# ═══════════════════════════════════════════════════════════
#  Daily Social Automation — 配置文件
# ═══════════════════════════════════════════════════════════

schedule:
  hour: 9
  minute: 0
  timezone: "Asia/Shanghai"

# ── 信息源 ────────────────────────────────────────────────
sources:
  # HackerNews Top Stories（英文科技/AI/创业）
  twitter:
    accounts: []          # 保留字段，实际由 HackerNews 抓取
    max_per_account: 15   # 抓取 HN top N 条

  # RSS 订阅（中文科技/商业）
  rss:
    feeds:
      - url: "https://36kr.com/feed"
        name: "36氪"
      - url: "https://www.huxiu.com/rss/article.xml"
        name: "虎嗅"
      - url: "https://sspai.com/feed"
        name: "少数派"
      - url: "https://www.producthunt.com/feed"
        name: "Product Hunt"
    max_per_feed: 5

  # 保留字段兼容
  xiaohongshu:
    keywords: []
    max_per_keyword: 0

# ── 内容筛选 ──────────────────────────────────────────────
selector:
  model: "claude-opus-4-6"
  criteria: |
    你关注的领域：AI、创业、产品、商业、一人公司（solopreneur/indie hacker）

    优先选择：
    1. AI 技术突破或 AI 产品落地的新鲜案例
    2. 一个人或小团队做出有影响力产品的故事
    3. 有反常识洞见、具体数据或真实案例的内容
    4. 商业模式创新或产品增长的新思路

    避免：
    - 纯新闻资讯（没有观点的信息播报）
    - 广告/软文/融资公告（无干货）
    - 宏观政策/金融市场类内容

# ── 推文生成 ──────────────────────────────────────────────
generator:
  model: "claude-opus-4-6"
  tweet_count: 3
  style: |
    风格要求：
    - 2~4 句话，有血有肉，不是标题党
    - 口语化，有自己的判断，像跟朋友聊天
    - 不用 hashtag，不用 emoji，不用感叹号堆砌
    - 中文为主，专有名词保留英文
    - 允许提出质疑、反直觉观点、具体数据

    好推文示例（学习这个味道）：
    "HN 今天讨论最多的不是 AI，是一个 3 人团队做的数据库工具，6 个月 ARR $200k。
    他们做的事很无聊：帮企业把 Excel 数据迁移到云端。但这件事每个公司都在痛，
    没人做好过。所谓市场机会，就是大家都嫌烂、又都离不开的那些地方。"

    "LLM 压缩模型这条路，本质是在赌一件事：智能的天花板不在参数量，在训练数据和算法效率。
    如果这个赌注是对的，未来跑在手机上的模型可能比今天的 GPT-4 还聪明。
    如果是错的，就只是省了点电费。"

    "Product Hunt 今天第一名是个一人公司，做 AI 简历筛选，月收入 $12k。
    没有融资，没有团队，就一个人。有意思的不是产品本身，而是他的获客方式：
    在 Reddit 的 HR 论坛里每天回答问题，半年积累了第一批用户。
    分发比产品本身更难想清楚。"

# ── 发布 ──────────────────────────────────────────────────
poster:
  confirm_timeout_minutes: 60
