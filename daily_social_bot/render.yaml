services:
  - type: web
    name: daily-social-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.callback:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_TOKEN_SECRET
        sync: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_USER_ID
        sync: false
