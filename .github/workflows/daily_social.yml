name: Daily Social Automation

on:
  push:
    branches: [claude/daily-social-automation-nkxxi]
  schedule:
    - cron: '0 1 * * *'    # 北京时间 09:00
    - cron: '0 3 * * *'    # 北京时间 11:00
    - cron: '0 6 * * *'    # 北京时间 14:00
    - cron: '0 9 * * *'    # 北京时间 17:00
    - cron: '0 13 * * *'   # 北京时间 21:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: daily_social_bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: daily_social_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run daily job
        env:
          TWITTER_USERNAME:           ${{ secrets.TWITTER_USERNAME }}
          TWITTER_PASSWORD:           ${{ secrets.TWITTER_PASSWORD }}
          KIMI_API_KEY:               ${{ secrets.KIMI_API_KEY }}
          GEMINI_API_KEY:             ${{ secrets.GEMINI_API_KEY }}
          FEISHU_APP_ID:              ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:          ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_ID:             ${{ secrets.FEISHU_USER_ID }}
        run: python run_job.py
