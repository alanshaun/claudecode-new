name: Daily Social Automation

on:
  schedule:
    - cron: '0 1 * * *'    # 北京时间 09:00
    - cron: '0 3 * * *'    # 北京时间 11:00
    - cron: '0 6 * * *'    # 北京时间 14:00
    - cron: '0 9 * * *'    # 北京时间 17:00
    - cron: '0 13 * * *'   # 北京时间 21:00
  workflow_dispatch:        # 允许手动触发测试

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily_social_bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: daily_social_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily job
        env:
          TWITTER_API_KEY:            ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:         ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:       ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_BEARER_TOKEN:       ${{ secrets.TWITTER_BEARER_TOKEN }}
          KIMI_API_KEY:               ${{ secrets.KIMI_API_KEY }}
          GEMINI_API_KEY:             ${{ secrets.GEMINI_API_KEY }}
          XHS_COOKIE:                 ${{ secrets.XHS_COOKIE }}
          FEISHU_APP_ID:              ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:          ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_ID:             ${{ secrets.FEISHU_USER_ID }}
          RENDER_POST_URL:            ${{ secrets.RENDER_POST_URL }}
          POST_SECRET:                ${{ secrets.POST_SECRET }}
        run: python run_job.py
